- id: "turn_on_mike_bedroom_lamp"
  alias: "Mike bedroom lamp - turn on when press buttons"
  description: ""
  triggers:
  - trigger: "mqtt"
    options:
      payload: "single"
      topic: "zigbee2mqtt/mikes_bedside_button/action"
  - trigger: "mqtt"
    options:
      payload: "single"
      topic: "zigbee2mqtt/upstairs_button/action"
  conditions:
  - condition: "light.is_off"
    target:
      entity_id: "light.mike_bedroom_lamp_bulb"
  actions:
  - action: "light.turn_on"
    metadata: {}
    target:
      entity_id: "light.mike_bedroom_lamp_bulb"
    data:
      color_temp_kelvin: 2000
  mode: "single"
