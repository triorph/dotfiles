- id: "dining_room_lamp_lamp_colour"
  alias: "dining_room_lamp - Set to new colour"
  description: ""
  triggers:
  - trigger: "state"
    entity_id: "input_number.downstairs_light_colour_index"
  conditions:
  - condition: "light.is_on"
    target:
      entity_id: "light.dining_room_lamp"
  variables:
    colour:
    - 255
    - 0
    - 0
    colour_cycle:
    - - 255
      - 137
      - 14
    - - 255
      - 193
      - 142
    - - 255
      - 229
      - 207
    - - 255
      - 255
      - 251
    - - 255
      - 112
      - 86
    - - 112
      - 255
      - 86
    - - 129
      - 173
      - 255
    - - 215
      - 151
      - 255
    - - 255
      - 159
      - 242
  actions:
  - action: "light.turn_on"
    metadata: {}
    target:
      entity_id: "light.dining_room_lamp"
    data:
      rgb_color: "{% set idx = states('input_number.downstairs_light_colour_index')\
        \ | int + 1 %} {% set idx = idx % colour_cycle | length %} {% set colour =\
        \ colour_cycle[idx] %} [{{colour[0]-}}, {{colour[1]-}}, {{colour[2]-}}]\n"
  mode: "single"
- id: "cycle_light_colours"
  alias: "Cycle light colours"
  description: ""
  triggers:
  - trigger: "mqtt"
    options:
      payload: "hold"
      topic: "zigbee2mqtt/downstairs_dial/action"
  - trigger: "mqtt"
    options:
      payload: "hold"
      topic: "zigbee2mqtt/upstairs_button/action"
  variables:
    colour_cycle:
    - - 255
      - 137
      - 14
    - - 255
      - 193
      - 142
    - - 255
      - 229
      - 207
    - - 255
      - 255
      - 251
    - - 255
      - 112
      - 86
    - - 112
      - 255
      - 86
    - - 129
      - 173
      - 255
    - - 215
      - 151
      - 255
    - - 255
      - 159
      - 242
  actions:
  - action: "input_number.set_value"
    entity_id: "input_number.downstairs_light_colour_index"
    data:
      value: "{% set idx = states('input_number.downstairs_light_colour_index') |\
        \ int + 1 %} {% set idx = idx % colour_cycle | length %} {{ idx }}\n"
  mode: "single"
- id: "heatpump_notify_turn_off"
  alias: "Downstairs heat pump - notify can be turned off at 18 degrees"
  description: ""
  triggers:
  - trigger: "temperature.crossed_threshold"
    target:
      entity_id: "sensor.living_room_temperature_temperature"
    options:
      behavior: "each"
      threshold:
        value:
          active_choice: "number"
          number: 18
          unit_of_measurement: "°C"
        type: "above"
      for:
        hours: 0
        minutes: 10
        seconds: 0
  conditions:
  - condition: "time"
    after: "09:00:00"
    before: "17:00:00"
  actions:
  - action: "notify.send_message"
    metadata: {}
    target:
      device_id: "449719a7d011795e08e37c0f114f4771"
    data:
      message: "Downstairs heat reached threshold "
  mode: "single"
