- id: "bring_in_washing"
  alias: "Washing machine - Bring in the washing"
  description: ""
  triggers:
  - trigger: "sun"
    event: "sunset"
    offset: 0
  conditions:
  - condition: "switch.is_on"
    target:
      entity_id: "input_boolean.washing_machine_ran_today"
    options:
      behavior: "any"
      for:
        hours: 0
        minutes: 10
        seconds: 0
  actions:
  - action: "input_boolean.turn_off"
    target:
      entity_id: "input_boolean.washing_machine_ran_today"
  - action: "notify.send_message"
    metadata: {}
    target:
      device_id: "449719a7d011795e08e37c0f114f4771"
    data:
      message: "Bring in the washing"
  mode: "single"
- id: "hang_up_washing"
  alias: "Washing machine - Hang up the washing"
  description: ""
  triggers:
  - trigger: "numeric_state"
    entity_id: "sensor.washing_machine_plug_current"
    for:
      hours: 0
      minutes: 20
      seconds: 0
    below: 0.1
  conditions:
  - condition: "switch.is_on"
    target:
      entity_id: "input_boolean.washing_machine_ran_today"
    options:
      behavior: "any"
      for:
        hours: 0
        minutes: 10
        seconds: 0
  actions:
  - action: "notify.send_message"
    metadata: {}
    target:
      device_id: "449719a7d011795e08e37c0f114f4771"
    data:
      message: "The washing machine has finished. Hang up the washing."
  mode: "single"
- id: "washing_machine_ran"
  alias: "Washing machine - Set ran today"
  description: ""
  triggers:
  - trigger: "numeric_state"
    entity_id: "sensor.washing_machine_plug_current"
    for:
      hours: 0
      minutes: 2
      seconds: 0
    above: 0.1
  actions:
  - action: "input_boolean.turn_on"
    target:
      entity_id: "input_boolean.washing_machine_ran_today"
  mode: "single"
