- id: "timer_office_heatpump_off"
  alias: "Turn off office heatpump on timer"
  description: ""
  triggers:
  - trigger: "time"
    at: "17:00:00"
  conditions:
  - condition: "climate.is_on"
    target:
      entity_id: "climate.mike_s_office_heatpump_mike_s_office_mike_s_office_heater"
    options:
      behavior: "any"
      for: "00:00:00"
  actions:
  - action: "climate.turn_off"
    metadata: {}
    target:
      entity_id: "climate.mike_s_office_heatpump_mike_s_office_mike_s_office_heater"
    data: {}
  mode: "single"
- id: "decrease_downstairs_lamp_brightness"
  alias: "Downstairs lamp - decrease brightness when turning button left"
  description: ""
  triggers:
  - trigger: "mqtt"
    options:
      payload: "rotate_left"
      topic: "zigbee2mqtt/downstairs_dial/action"
  actions:
  - action: "light.turn_on"
    metadata: {}
    target:
      entity_id: "light.dining_room_lamp"
    data:
      brightness_step_pct: -20
  mode: "single"
- id: "increase_downstairs_lamp_brightness"
  alias: "Downstairs lamp - increase lamp brightness when turning button right"
  description: ""
  triggers:
  - trigger: "mqtt"
    options:
      payload: "rotate_right"
      topic: "zigbee2mqtt/downstairs_dial/action"
  actions:
  - action: "light.turn_on"
    metadata: {}
    target:
      entity_id: "light.dining_room_lamp"
    data:
      brightness_step_pct: 20
  mode: "single"
